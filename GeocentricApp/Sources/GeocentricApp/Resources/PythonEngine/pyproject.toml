[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geocentric"
version = "0.1.0"
description = "A local, offline coding agent CLI powered by Ollama."
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "requests>=2.31",
    "urllib3<2; platform_system == 'Darwin'",
    "pygments>=2.17",
]

[project.scripts]
geo = "geocentric.cli:main"

[tool.setuptools]
packages = ["geocentric", "geocentric.tools", "geocentric.ui"]
